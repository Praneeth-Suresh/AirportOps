<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body>
    <!-- Master reel: sequences all 7 beats. Each beat is also a standalone
         composition in compositions/ that can be rendered to its own MP4. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="76"
      data-width="1920"
      data-height="1080"
    >
      <div class="clip" id="s-opener"    data-composition-id="s-opener"    data-composition-src="compositions/opener.html"    data-start="0"  data-duration="8"  data-track-index="0"></div>
      <div class="clip" id="s-problem"   data-composition-id="s-problem"   data-composition-src="compositions/problem.html"   data-start="8"  data-duration="8"  data-track-index="0"></div>
      <div class="clip" id="s-dashboard" data-composition-id="s-dashboard" data-composition-src="compositions/dashboard.html" data-start="16" data-duration="20" data-track-index="0"></div>
      <div class="clip" id="s-vj882"     data-composition-id="s-vj882"     data-composition-src="compositions/vj882.html"     data-start="36" data-duration="10" data-track-index="0"></div>
      <div class="clip" id="s-otto"      data-composition-id="s-otto"      data-composition-src="compositions/otto.html"      data-start="46" data-duration="10" data-track-index="0"></div>
      <div class="clip" id="s-hood"      data-composition-id="s-hood"      data-composition-src="compositions/hood.html"      data-start="56" data-duration="10" data-track-index="0"></div>
      <div class="clip" id="s-closing"   data-composition-id="s-closing"   data-composition-src="compositions/closing.html"   data-start="66" data-duration="10" data-track-index="0"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
