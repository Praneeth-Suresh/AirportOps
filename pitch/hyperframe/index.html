<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body>
    <!-- Master reel: cover + 9 slides. Each also renders standalone to its own MP4
         for the click-through presenter. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="104"
      data-width="1920"
      data-height="1080"
    >
      <div class="clip" id="s-cover"      data-composition-id="s-cover"      data-composition-src="compositions/cover.html"      data-start="0"   data-duration="6"  data-track-index="0"></div>
      <div class="clip" id="s-opener"     data-composition-id="s-opener"     data-composition-src="compositions/opener.html"     data-start="6"   data-duration="8"  data-track-index="0"></div>
      <div class="clip" id="s-flight"     data-composition-id="s-flight"     data-composition-src="compositions/flight.html"     data-start="14"  data-duration="10" data-track-index="0"></div>
      <div class="clip" id="s-passengers" data-composition-id="s-passengers" data-composition-src="compositions/passengers.html" data-start="24"  data-duration="12" data-track-index="0"></div>
      <div class="clip" id="s-staff"      data-composition-id="s-staff"      data-composition-src="compositions/staff.html"      data-start="36"  data-duration="12" data-track-index="0"></div>
      <div class="clip" id="s-realtime"   data-composition-id="s-realtime"   data-composition-src="compositions/realtime.html"   data-start="48"  data-duration="12" data-track-index="0"></div>
      <div class="clip" id="s-otto"       data-composition-id="s-otto"       data-composition-src="compositions/otto.html"       data-start="60"  data-duration="12" data-track-index="0"></div>
      <div class="clip" id="s-hood"       data-composition-id="s-hood"       data-composition-src="compositions/hood.html"       data-start="72"  data-duration="10" data-track-index="0"></div>
      <div class="clip" id="s-closing"    data-composition-id="s-closing"    data-composition-src="compositions/closing.html"    data-start="82"  data-duration="12" data-track-index="0"></div>
      <div class="clip" id="s-team"       data-composition-id="s-team"       data-composition-src="compositions/team.html"       data-start="94"  data-duration="10" data-track-index="0"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
