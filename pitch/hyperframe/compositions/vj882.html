<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body>
    <div id="root" data-composition-id="vj882" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="10" data-track-index="0">
        <div class="stage"></div>
        <div class="grid"></div>
        <div class="dotfield"></div>
        <div class="scrim"></div>
        <div class="placeholder-tag">▶ PLACEHOLDER · VJ882 forecast (V5)</div>
      </div>

      <div class="wordmark clip" id="wordmark" data-start="0" data-duration="10" data-track-index="1">
        <div class="mark">A</div>
        <div class="name">AirportOps</div>
      </div>

      <div class="beat-label clip" data-start="0" data-duration="10" data-track-index="2" id="vl">
        <div class="beat-kicker">4:30 PM · Vietjet VJ882</div>
        <div class="beat-title">Staffing capacity meets demand</div>
      </div>

      <div class="ring clip" id="ring1" style="left: 620px; top: 520px" data-start="0.8" data-duration="9.2" data-track-index="3">
        <div class="circle"></div>
        <div class="rlabel">Gate 10 · 3 staff idle</div>
      </div>
      <div class="ring accent clip" id="ring2" style="left: 1320px; top: 430px" data-start="1.5" data-duration="8.5" data-track-index="4">
        <div class="circle"></div>
        <div class="rlabel">Gate 5 · VJ882 arriving</div>
      </div>

      <!-- animated Gate 10 -> Gate 5 arrow -->
      <svg class="arrow-svg clip" id="arrow" data-start="2.2" data-duration="7.8" data-track-index="5" width="1920" height="1080">
        <defs>
          <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
            <path d="M0,0 L12,6 L0,12 Z" fill="#37d6a0" />
          </marker>
        </defs>
        <path id="arrowpath" d="M 664 520 Q 970 388 1276 442" fill="none" stroke="#37d6a0" stroke-width="5"
          stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#ah)" />
      </svg>

      <script src="assets/stage.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        gsap.set("#ring1, #ring2", { xPercent: -50, yPercent: -50 });
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#vl", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo("#ring1", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.8);
        tl.fromTo("#ring2", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 1.5);
        tl.fromTo("#arrowpath", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1, ease: "power1.inOut" }, 2.2);
        window.__timelines["vj882"] = tl;
      </script>
    </div>
  </body>
</html>
