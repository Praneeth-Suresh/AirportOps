<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="assets/dash.css" />
    <style>
      .closeboxes { position: absolute; left: 0; right: 0; bottom: 214px; display: flex; justify-content: center; gap: 24px; font-family: "IBM Plex Sans", sans-serif; }
      .cbox { background: rgba(11, 16, 21, 0.62); border: 1px solid #2b3742; border-radius: 13px; padding: 15px 30px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45); }
      .cbox.a { border-top: 3px solid #29a3ff; }
      .cbox.b { border-top: 3px solid #32c783; }
      .cbox.c { border-top: 3px solid #f5b942; }
      .cbox .t { color: #f3f6f8; font-size: 27px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="closing" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div class="dash clip hide-copilot" id="dash" data-start="0" data-duration="12" data-track-index="0"></div>

      <div class="closeboxes clip" id="boxes" data-start="0" data-duration="12" data-track-index="1" data-layout-allow-occlusion>
        <div class="cbox a"><div class="t">Total Live Visibility</div></div>
        <div class="cbox b"><div class="t">Foresight</div></div>
        <div class="cbox c"><div class="t">AI on Watch</div></div>
      </div>

      <script src="assets/dash.js"></script>
      <script src="assets/dashfx.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const dash = document.getElementById("dash");
        dash.innerHTML = window.SentinelDash.variants.min60;
        const tl = gsap.timeline({ paused: true });
        const fx = window.DashFX.overlay(dash);
        // three planes taxi in to gates A, B, D
        window.DashFX.dock(tl, window.DashFX.plane(fx, "#29a3ff"), [[-170, 540], [-30, 505], [55, 450], [104, 410]], 118, 2.5, 0.4);
        window.DashFX.dock(tl, window.DashFX.plane(fx, "#29a3ff"), [[1620, 540], [1478, 500], [1392, 448], [1344, 410]], 242, 2.5, 1.1);
        window.DashFX.dock(tl, window.DashFX.plane(fx, "#29a3ff"), [[1620, 760], [1478, 720], [1392, 692], [1344, 672]], 242, 2.5, 1.8);
        // passengers moving in several streams
        window.DashFX.pax(tl, fx, [[150, 418], [320, 448], [470, 496], [610, 524]], { count: 7, at: 0.3, stagger: 1.5 });
        window.DashFX.pax(tl, fx, [[1300, 420], [1120, 470], [960, 520], [800, 545]], { count: 7, at: 0.7, stagger: 1.5 });
        window.DashFX.pax(tl, fx, [[724, 300], [724, 470], [640, 620], [560, 720]], { count: 6, at: 1.1, stagger: 1.6 });
        // staff scattered by role
        const G = "#f5b942", I = "#8fd0ff", S = "#27d3d1", A = "#32c783";
        window.DashFX.staff(tl, fx, [[232, 476, G], [1150, 476, G], [724, 306, I], [432, 764, S], [1018, 764, S], [542, 566, A], [904, 566, A]], 1.4);
        tl.fromTo(".cbox", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.16, ease: "power2.out" }, 0.6);
        window.__timelines["closing"] = tl;
      </script>
    </div>
  </body>
</html>
