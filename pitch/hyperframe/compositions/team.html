<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body>
    <div id="root" data-composition-id="team" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="10" data-track-index="0">
        <div class="stage"></div>
        <div class="grid"></div>
      </div>

      <div class="wordmark clip" id="wordmark" data-start="0" data-duration="10" data-track-index="1">
        <img src="assets/sentinel-logo.jpg" alt="Sentinel" style="height:96px; mix-blend-mode:screen; display:block;" />
      </div>

      <div class="team-wrap clip" id="team" data-start="0" data-duration="10" data-track-index="2">
        <div class="team-heading" id="team-heading">
          <div class="team-title">The Team</div>
        </div>
        <div class="team-row">
          <div class="member">
            <img class="photo" src="assets/team/daven.jpeg" alt="Daven" />
            <div class="m-name">Daven</div>
            <div class="m-role">Business &amp; AI Systems, Marketing Manager</div>
            <div class="school-pill"><img src="assets/team/nus.png" alt="NUS" /></div>
          </div>
          <div class="member">
            <img class="photo" src="assets/team/praneeth.png" alt="Praneeth" />
            <div class="m-name">Praneeth</div>
            <div class="m-role">Computer Science, AI/ML Engineer</div>
            <div class="school-pill"><img src="assets/team/nus.png" alt="NUS" /></div>
          </div>
          <div class="member">
            <img class="photo" src="assets/team/sarah.jpeg" alt="Sarah" />
            <div class="m-name">Sarah</div>
            <div class="m-role">Computer Science, Product Manager</div>
            <div class="school-pill"><img src="assets/team/nus.png" alt="NUS" /></div>
          </div>
          <div class="member">
            <img class="photo" src="assets/team/kalent.jpeg" alt="Kalent" />
            <div class="m-name">Kalent</div>
            <div class="m-role">Data Analytics, UI/UX Manager</div>
            <div class="school-pill"><img src="assets/team/nus.png" alt="NUS" /></div>
          </div>
          <div class="member">
            <img class="photo" src="assets/team/ethan.jpeg" alt="Ethan" />
            <div class="m-name">Ethan</div>
            <div class="m-role">Computer Science, Software Engineer</div>
            <div class="school-pill"><img src="assets/team/vanhien.png" alt="Trường Đại Học Văn Hiến" /></div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#team-heading", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo(".member", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.55, stagger: 0.13, ease: "power2.out" }, 0.5);
        window.__timelines["team"] = tl;
      </script>
    </div>
  </body>
</html>
