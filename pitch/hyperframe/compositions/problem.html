<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body>
    <div id="root" data-composition-id="problem" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="8" data-track-index="0">
        <div class="stage"></div>
        <div class="grid"></div>
        <div class="dotfield"></div>
        <div class="scrim"></div>
        <div class="placeholder-tag">▶ PLACEHOLDER · Hero dashboard (V1) — reused</div>
      </div>

      <div class="wordmark clip" id="wordmark" data-start="0" data-duration="8" data-track-index="1">
        <div class="mark">A</div>
        <div class="name">AirportOps</div>
      </div>

      <div class="beat-label clip" data-start="0" data-duration="8" data-track-index="2" id="pb">
        <div class="beat-kicker">The problem</div>
        <div class="beat-title">Ops still runs on manual observation</div>
      </div>

      <script src="assets/stage.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#pb", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.2);
        window.__timelines["problem"] = tl;
      </script>
    </div>
  </body>
</html>
