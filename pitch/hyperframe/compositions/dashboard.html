<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body>
    <div id="root" data-composition-id="dashboard" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="20" data-track-index="0">
        <div class="stage"></div>
        <div class="grid"></div>
        <div class="dotfield"></div>
        <div class="scrim"></div>
        <div class="placeholder-tag">▶ PLACEHOLDER · Dashboard clips — V2 flight · V3 passengers · V4 staff</div>
      </div>

      <div class="wordmark clip" id="wordmark" data-start="0" data-duration="20" data-track-index="1">
        <div class="mark">A</div>
        <div class="name">AirportOps</div>
      </div>

      <div class="beat-label clip" data-start="0" data-duration="6" data-track-index="2" id="d1">
        <div class="beat-kicker">Live in 3D</div>
        <div class="beat-title">Flights, arriving &amp; departing</div>
      </div>
      <div class="beat-label clip" data-start="6" data-duration="6" data-track-index="3" id="d2">
        <div class="beat-kicker">Live in 3D</div>
        <div class="beat-title">Passengers, flowing to immigration</div>
      </div>
      <div class="beat-label clip" data-start="12" data-duration="8" data-track-index="4" id="d3">
        <div class="beat-kicker">Live in 3D</div>
        <div class="beat-title">Staff, colour-coded by role</div>
      </div>

      <div class="legend clip" data-start="12" data-duration="8" data-track-index="5" id="legend">
        <div class="legend-row"><div class="legend-swatch" style="background:#ffb23e;box-shadow:0 0 16px #ffb23e"></div><div class="legend-label">Ground crew</div></div>
        <div class="legend-row"><div class="legend-swatch" style="background:#39c2ff;box-shadow:0 0 16px #39c2ff"></div><div class="legend-label">Immigration officers</div></div>
        <div class="legend-row"><div class="legend-swatch" style="background:#ff5c6c;box-shadow:0 0 16px #ff5c6c"></div><div class="legend-label">Security staff</div></div>
        <div class="legend-row"><div class="legend-swatch" style="background:#37d6a0;box-shadow:0 0 16px #37d6a0"></div><div class="legend-label">Airline staff</div></div>
      </div>

      <script src="assets/stage.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#d1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo("#d2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.2);
        tl.fromTo("#d3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 12.2);
        tl.fromTo("#legend .legend-row", { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.5, stagger: 0.16, ease: "power2.out" }, 12.4);
        window.__timelines["dashboard"] = tl;
      </script>
    </div>
  </body>
</html>
