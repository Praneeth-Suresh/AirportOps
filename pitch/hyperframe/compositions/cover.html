<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="clip" id="cov" data-start="0" data-duration="6" data-track-index="0" style="position:absolute; inset:0; background:#0a0e1a;">
        <img src="assets/cover.png" alt="Sentinel" style="width:100%; height:100%; object-fit:cover; display:block;" />
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#cov", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 0);
        window.__timelines["cover"] = tl;
      </script>
    </div>
  </body>
</html>
